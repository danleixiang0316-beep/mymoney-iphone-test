<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#195d47"><title>MyMoney · 本机账本</title><link rel="manifest" href="app.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="home.css"><link rel="stylesheet" href="mobile.css"><style>main{margin:auto;max-width:52rem}label{display:block;margin:.7rem 0}input{max-width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{margin:.3rem 0} [hidden]{display:none!important}</style><script defer src="start.js"></script></head><body><main><header><div><small>MyMoney · 此设备的虚拟账本</small><h1>本月总支出</h1></div><label>月份 <input id="month" type="month"></label></header>
<section class="expense-hero"><div class="total" id="total">—</div><p id="counts"></p></section><p id="offline" role="status">正在检查离线资源…</p>
<nav class="mobile-nav"><a href="#import">批量导入</a><a href="#detail">交易明细</a><a href="review.html">待审核</a><a href="operations.html">操作记录与撤销</a><a href="#backup">备份与恢复</a></nav>
<section class="panel" id="import"><h2>批量导入虚拟账单</h2><label>从“文件”选择一个或多个 CSV 或微信账单 ZIP<input type="file" id="files" accept=".csv,.zip,text/csv,application/zip,application/x-zip-compressed" multiple></label><pre id="preview" aria-live="polite"></pre><button hidden id="save">确认导入预览中合格的文件</button></section>
<dialog id="zipDialog"><form method="dialog" autocomplete="off"><h2>解锁微信账单</h2><p id="zipName"></p><label>本次解压码<input type="password" id="zipCode" autocomplete="off" spellcheck="false"></label><button value="unlock">解锁并预览</button><button value="cancel">取消</button></form></dialog><section id="detail" class="panel"><h2>所选月交易明细</h2><pre id="rows"></pre></section>
<section id="backup" class="panel"><h2>加密备份与恢复</h2><p>Safari 本地数据可能被清除。请把加密文件另存到“文件”，并保留一份设备外副本。遗忘口令无法恢复。</p><p id="last"></p><label>备份口令（至少八个字符）<input id="password" type="password" autocomplete="off"></label><button id="export">生成加密备份</button> <a id="download" hidden>保存备份文件</a> <button id="saved" hidden>我已另存备份文件</button>
<label>选择要恢复的 .mymoney 文件<input type="file" id="restoreFile" accept=".mymoney"></label><button id="validate">校验并预览恢复</button><p id="restoreInfo"></p><button id="restore" hidden>确认替换本机账本</button> <button id="safety" hidden>下载上次恢复前的安全备份</button></section><p id="msg" role="status" aria-live="polite"></p></main>
<script src="zip-native.js"></script><script src="rules.js"></script><script src="store.js"></script><script src="home.js"></script></body></html>
